<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Inspector with lil-gui</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background-color: #050505; font-family: sans-serif; color: white; height: 300vh; }
        #canvas-container { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        .section { position: relative; height: 100vh; display: flex; align-items: center; padding: 0 10%; z-index: 2; pointer-events: none; }
        .content { max-width: 400px; background: rgba(0,0,0,0.6); padding: 20px; border-radius: 8px; }
        /* Style adjustments so the GUI sits nicely on top */
        .lil-gui { --background-color: rgba(20, 20, 20, 0.9); --text-color: #fff; z-index: 100 !important; }
    </style>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="section">
        <div class="content">
            <h1>Use the GUI Panel</h1>
            <p>Look at the top right! Use the sliders to find your perfect X, Y, Z coordinates, then use those numbers in your script.</p>
        </div>
    </div>
    <div class="section"></div>

    <!-- CDNs (Added lil-gui) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        // 1. Core Scene Setup
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 0, 5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
        keyLight.position.set(5, 8, 5);
        scene.add(keyLight);

        // Initialize lil-gui panel
        const gui = new lil.GUI({ title: '3D Scene Tweaker' });

        // 2. Load Model & Setup Controls
        const loader = new THREE.GLTFLoader();
        let myModel;

        loader.load(
            'https://threejs.org/examples/models/gltf/DamagedHelmet/glTF/DamagedHelmet.gltf',
            function (gltf) {
                myModel = gltf.scene;
                myModel.position.set(0, 0, -5);

                myModel.rotation.set(-1, 0, 0);
                myModel.scale.set(1.5, 1.5, 1.5);
                scene.add(myModel);

                // --- ADDING SLIDERS FOR THE MODEL ---
                // Folder for positions
                const posFolder = gui.addFolder('Model Position');
                posFolder.add(myModel.position, 'x', -5, 5, 0.1).name('X (Left/Right)').listen();
                posFolder.add(myModel.position, 'y', -5, 5, 0.1).name('Y (Up/Down)').listen();
                posFolder.add(myModel.position, 'z', -5, 5, 0.1).name('Z (Depth)').listen();

                // Folder for rotation (using Radians, from -Math.PI to Math.PI)
                const rotFolder = gui.addFolder('Model Rotation');
                rotFolder.add(myModel.rotation, 'x', -Math.PI, Math.PI, 0.01).name('Rotate X').listen();
                rotFolder.add(myModel.rotation, 'y', -Math.PI, Math.PI, 0.01).name('Rotate Y').listen();
                rotFolder.add(myModel.rotation, 'z', -Math.PI, Math.PI, 0.01).name('Rotate Z').listen();

                // Folder for Lighting Exposure
                const lightFolder = gui.addFolder('Environment Lighting');
                lightFolder.add(renderer, 'toneMappingExposure', 0, 5, 0.1).name('Brightness');

                // --- SCROLL TIMELINE ---
                // Switch off the sliders' manual override when scrolling by pinning them to a scroll timeline
                const tl = gsap.timeline({
                    scrollTrigger: {
                        trigger: "body",
                        start: "top top",
                        end: "bottom bottom",
                        scrub: 1,
                    }
                });

                // Example scroll paths using numbers found via the sliders
                tl.to(myModel.position, {z: 1.5 })
                  .to(myModel.rotation, {x: 0 }, 0) // '0' means run at same time as above
                  .to(myModel.position, {z: -1 })
                  .to(myModel.rotation, {x: 0.2});
            }
        );

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
