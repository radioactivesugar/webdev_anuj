<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Traditional Minimal Card Sequence</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background-color: #0d0d11;
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                color: #fff;
                overflow-x: hidden;
                -webkit-font-smoothing: antialiased;
            }

            /* --- TRADITIONAL SERIF HEADERS & ELEMENTS --- */
            header,
            .logo,
            nav a,
            .card h3,
            .audio-prompt {
                font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            }

            header {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                padding: 30px 50px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 100;
                background: linear-gradient(
                    to bottom,
                    rgba(13, 13, 17, 0.9),
                    transparent
                );
                border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            }

            .logo {
                font-weight: 400;
                letter-spacing: 3px;
                font-size: 1.3rem;
                text-transform: uppercase;
            }

            .nav-container {
                display: flex;
                align-items: center;
                gap: 30px;
            }

            nav a {
                color: #fff;
                text-decoration: none;
                opacity: 0.7;
                font-style: italic;
                font-size: 1.05rem;
                transition: opacity 0.3s;
            }
            nav a:hover {
                opacity: 1;
            }

            /* --- EDITORIAL AUDIO TOGGLE BUTTON --- */
            .audio-toggle {
                background: none;
                border: 1px solid rgba(223, 193, 134, 0.3);
                border-radius: 50%;
                width: 36px;
                height: 36px;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                color: #dfc186; /* Premium Champagne Gold Accent */
                transition: all 0.3s ease;
                padding: 0;
            }

            .audio-toggle:hover {
                background: rgba(223, 193, 134, 0.1);
                border-color: #dfc186;
                transform: scale(1.05);
            }

            .audio-toggle svg {
                width: 16px;
                height: 16px;
                fill: currentColor;
            }

            /* --- TAP TO PLAY INITIAL PROMPT --- */
            .audio-prompt {
                position: fixed;
                bottom: 60px;
                left: 50%;
                transform: translateX(-50%);
                color: #dfc186;
                font-style: italic;
                font-size: 1.6rem;
                letter-spacing: 1px;
                cursor: pointer;
                z-index: 99;
                opacity: 0.8;
                transition: all 0.4s ease;
                text-align: center;
                animation: gentlePulse 2.5s infinite ease-in-out;
            }

            .audio-prompt:hover {
                opacity: 1;
                letter-spacing: 1.5px;
            }

            @keyframes gentlePulse {
                0%,
                100% {
                    opacity: 0.4;
                    transform: translateX(-50%) scale(0.98);
                }
                50% {
                    opacity: 0.9;
                    transform: translateX(-50%) scale(1);
                }
            }

            footer {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 40px 50px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 100;
                background: #0d0d11;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                font-size: 0.85rem;
                letter-spacing: 1px;
                text-transform: uppercase;
                opacity: 0.5;
            }

            .scroll-container {
                position: relative;
                height: 1400vh;
            }

            .canvas-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 1;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            canvas {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            .cards-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 2;
                pointer-events: none;
            }

            .card {
                position: absolute;
                width: 90%;
                max-width: 380px;
                background: rgba(18, 18, 24, 0.65);
                border: 1px solid rgba(255, 255, 255, 0.06);
                border-radius: 4px;
                padding: 35px;
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
                opacity: 0;
                transform: scale(0.97) translateY(15px);
            }

            .card h3 {
                margin-bottom: 14px;
                color: #dfc186;
                font-size: 1.45rem;
                font-weight: 400;
                letter-spacing: 0.5px;
            }

            .card p {
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                font-size: 0.92rem;
                line-height: 1.65;
                opacity: 0.7;
                font-weight: 300;
            }
        </style>
    </head>
    <body>
        <header>
            <div class="logo">५६ Bhog</div>
            <div class="nav-container">
                <nav><a href="#">Coming</a><a href="#">Soon</a></nav>
                <button
                    class="audio-toggle"
                    id="audio-btn"
                    title="Tap to play audio"
                >
                    <svg id="speaker-icon" viewBox="0 0 24 24">
                        <path
                            d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM4.3 3L3 4.3 7.7 9H3v6h4l5 5V13.3l4.3 4.3c-.66.52-1.4.93-2.3 1.2v2.06c1.45-.31 2.77-.97 3.87-1.87L19.7 21l1.3-1.3L4.3 3zM12 4L9.91 6.09 12 8.18V4z"
                        />
                    </svg>
                </button>
            </div>
        </header>

        <div class="audio-prompt" id="audio-prompt-txt">
            Tap to experience audio
        </div>

        <div class="scroll-container">
            <div class="canvas-container">
                <canvas id="sequence-canvas"></canvas>
            </div>

            <div class="cards-overlay" id="cards-container"></div>

            <footer>
                <div>© 2026 Anuj + Vineet. All rights reserved.</div>
                <div>Made for ५६ Bhog</div>
            </footer>
        </div>

        <script>
            // --- AUDIO SYSTEM CONFIGURATION ---
            const bgMusic = new Audio("/bhog56/music.ogg");
            bgMusic.loop = true;
            bgMusic.volume = 0.45;

            let isPlaying = false;
            const audioBtn = document.getElementById("audio-btn");
            const audioPromptTxt = document.getElementById("audio-prompt-txt");
            const speakerIcon = document.getElementById("speaker-icon");

            const mutedPath =
                "M16.5 12c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77zM4.3 3L3 4.3 7.7 9H3v6h4l5 5V13.3l4.3 4.3c-.66.52-1.4.93-2.3 1.2v2.06c1.45-.31 2.77-.97 3.87-1.87L19.7 21l1.3-1.3L4.3 3zM12 4L9.91 6.09 12 8.18V4z";
            const unmutedPath =
                "M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z";

            function toggleAudio() {
                if (isPlaying) {
                    bgMusic.pause();
                    speakerIcon
                        .querySelector("path")
                        .setAttribute("d", mutedPath);
                    audioBtn.setAttribute("title", "Tap to play audio");
                    isPlaying = false;
                } else {
                    bgMusic
                        .play()
                        .then(() => {
                            speakerIcon
                                .querySelector("path")
                                .setAttribute("d", unmutedPath);
                            audioBtn.setAttribute("title", "Mute audio");
                            isPlaying = true;
                            // Fade prompt text away immediately if manually activated before scrolling
                            gsap.to(audioPromptTxt, {
                                opacity: 0,
                                y: 15,
                                duration: 0.5,
                                onComplete: () =>
                                    (audioPromptTxt.style.display = "none"),
                            });
                        })
                        .catch((err) =>
                            console.log("Audio play blocked:", err),
                        );
                }
            }

            // Bind click listeners to both the top icon button and the helper text prompt
            audioBtn.addEventListener("click", toggleAudio);
            audioPromptTxt.addEventListener("click", toggleAudio);

            // --- TIMING CONFIGURATIONS ---
            const cardConfig = [
                {
                    id: 1,
                    title: "Welcome Video",
                    text: "The introductory video will be shown here.",
                    startFrame: 19,
                    endFrame: 30,
                    position: { top: "25%", left: "10%" },
                },
                {
                    id: 2,
                    title: "About Us/ Origin Story",
                    text: "This will include pictures and a brief history of the company.",
                    startFrame: 49,
                    endFrame: 62,
                    position: { top: "25%", right: "10%" },
                },
                {
                    id: 3,
                    title: "Menu",
                    text: "The menu with pictures of the dishes will be shown here.",
                    startFrame: 70,
                    endFrame: 85,
                    position: { bottom: "25%", left: "12%" },
                },
                {
                    id: 4,
                    title: "Upcoming Events",
                    text: "Current events that are happening are shown here with images.",
                    startFrame: 100,
                    endFrame: 114,
                    position: { bottom: "25%", right: "12%" },
                },
                {
                    id: 5,
                    title: "Instagram Photos/ Gallery",
                    text: "Photos from our Instagram feed will be shown here in a grid format.",
                    startFrame: 134,
                    endFrame: 142,
                    position: {
                        top: "40%",
                        left: "50%",
                        transform: "translateX(-50%)",
                    },
                },
                {
                    id: 6,
                    title: "Testimonials",
                    text: "Testimonials from our customers are shown here from Google reviews.",
                    startFrame: 160,
                    endFrame: 190,
                    position: {
                        bottom: "20%",
                        left: "50%",
                        transform: "translateX(-50%)",
                    },
                },
                {
                    id: 7,
                    title: "Contact Us",
                    text: "Email, contact number, feedback form.",
                    startFrame: 215,
                    endFrame: 230,
                    position: {
                        bottom: "20%",
                        left: "50%",
                        transform: "translateX(-50%)",
                    },
                },
                {
                    id: 8,
                    title: "Thank you For Visiting",
                    text: "Visit us soon at our new resturant.",
                    startFrame: 250,
                    endFrame: 270,
                    position: {
                        bottom: "20%",
                        left: "50%",
                        transform: "translateX(-50%)",
                    },
                },
            ];

            const canvas = document.getElementById("sequence-canvas");
            const context = canvas.getContext("2d");

            canvas.width = 1920;
            canvas.height = 1080;

            const frameCount = 300;
            const currentFrame = (index) =>
                `/bhog56/toWEBP/Image Seq${String(index + 1).padStart(4, "0")}.webp`;

            const images = [];
            const videoSequence = { frame: 0 };

            for (let i = 0; i < frameCount; i++) {
                const img = new Image();
                img.src = currentFrame(i);
                images.push(img);
            }

            function render() {
                context.clearRect(0, 0, canvas.width, canvas.height);
                const img = images[videoSequence.frame];
                if (!img) return;

                const hRatio = canvas.width / img.width;
                const vRatio = canvas.height / img.height;
                const ratio = Math.max(hRatio, vRatio);
                const centerShift_x = (canvas.width - img.width * ratio) / 2;
                const centerShift_y = (canvas.height - img.height * ratio) / 2;

                context.drawImage(
                    img,
                    0,
                    0,
                    img.width,
                    img.height,
                    centerShift_x,
                    centerShift_y,
                    img.width * ratio,
                    img.height * ratio,
                );
            }

            images[0].onload = render;

            // --- GENERATE DOM CARDS ---
            const container = document.getElementById("cards-container");
            cardConfig.forEach((config) => {
                const cardEl = document.createElement("div");
                cardEl.className = "card";
                cardEl.id = `card-${config.id}`;
                cardEl.innerHTML = `<h3>${config.title}</h3><p>${config.text}</p>`;
                Object.assign(cardEl.style, config.position);
                container.appendChild(cardEl);
            });

            // --- MASTER SCROLL TIMELINE ---
            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: ".scroll-container",
                    start: "top top",
                    end: "bottom bottom",
                    scrub: 1,
                },
            });

            // Cleanly fade out the text helper prompt immediately on scroll movement
            tl.to(
                audioPromptTxt,
                {
                    opacity: 0,
                    y: -20,
                    duration: 2, // Maps beautifully onto the immediate first scroll frames
                    ease: "power1.inOut",
                },
                0,
            );

            tl.to(
                videoSequence,
                {
                    frame: frameCount - 1,
                    snap: "frame",
                    ease: "none",
                    onUpdate: render,
                    duration: frameCount,
                },
                0,
            );

            // --- AUTOMATED GSAP TIMELINE MAPPER ---
            cardConfig.forEach((config) => {
                const cardSelector = `#card-${config.id}`;
                const fadeDuration = 2;

                tl.to(
                    cardSelector,
                    {
                        opacity: 1,
                        scale: 1,
                        y: 0,
                        duration: fadeDuration,
                        ease: "power2.out",
                    },
                    config.startFrame,
                );
                tl.to(
                    cardSelector,
                    {
                        opacity: 0,
                        y: -15,
                        scale: 0.99,
                        duration: fadeDuration,
                        ease: "power2.in",
                    },
                    config.endFrame - fadeDuration,
                );
            });
        </script>
    </body>
</html>
