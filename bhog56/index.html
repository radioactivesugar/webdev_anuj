<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Traditional Minimal Card Sequence</title>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background-color: #0d0d11;
                /* SANS-SERIF FOR THE GENERAL BODY COPY */
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    sans-serif;
                color: #fff;
                overflow-x: hidden;
                -webkit-font-smoothing: antialiased;
            }

            /* --- TRADITIONAL SERIF HEADERS & ELEMENTS --- */
            header,
            .logo,
            nav a,
            .card h3 {
                font-family: Georgia, Cambria, "Times New Roman", Times, serif;
            }

            header {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                padding: 30px 50px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 100;
                background: linear-gradient(
                    to bottom,
                    rgba(13, 13, 17, 0.9),
                    transparent
                );
                border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            }

            .logo {
                font-weight: 400;
                letter-spacing: 3px;
                font-size: 1.3rem;
                text-transform: uppercase;
            }

            nav a {
                color: #fff;
                text-decoration: none;
                margin-left: 30px;
                opacity: 0.7;
                font-style: italic; /* Classic transitional editorial touch */
                font-size: 1.05rem;
                transition: opacity 0.3s;
            }
            nav a:hover {
                opacity: 1;
            }

            footer {
                position: absolute;
                bottom: 0;
                left: 0;
                width: 100%;
                padding: 40px 50px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 100;
                background: #0d0d11;
                border-top: 1px solid rgba(255, 255, 255, 0.05);
                font-size: 0.85rem;
                letter-spacing: 1px;
                text-transform: uppercase;
                opacity: 0.5;
            }

            .scroll-container {
                position: relative;
                height: 1400vh;
            }

            .canvas-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 1;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            canvas {
                width: 100%;
                height: 100%;
                object-fit: cover;
            }

            /* FRAME PANEL DEBUGGER (SANS-SERIF MONOSPACE) */
            .frame-debugger {
                position: fixed;
                top: 30px;
                right: 30px;
                background: rgba(13, 13, 17, 0.9);
                border: 1px solid rgba(223, 193, 134, 0.3); /* Soft Gold border tint */
                color: #dfc186; /* Champagne Gold Theme Color */
                font-family: monospace;
                font-size: 0.8rem;
                padding: 6px 12px;
                border-radius: 4px;
                z-index: 999;
                pointer-events: none;
                letter-spacing: 1px;
            }

            .cards-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 2;
                pointer-events: none;
            }

            /* CLASSIC TRADITIONAL CARD THEME */
            .card {
                position: absolute;
                width: 90%;
                max-width: 380px;
                background: rgba(
                    18,
                    18,
                    24,
                    0.65
                ); /* Richer, darker background contrast */
                border: 1px solid rgba(255, 255, 255, 0.06);
                border-radius: 4px; /* Shaper corners look more editorial and traditional than heavy rounded pill styles */
                padding: 35px;
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
                opacity: 0;
                transform: scale(0.97) translateY(15px);
            }

            /* SERIF FOR CARD HEADING */
            .card h3 {
                margin-bottom: 14px;
                color: #dfc186; /* Premium Champagne Gold Accent */
                font-size: 1.45rem;
                font-weight: 400;
                letter-spacing: 0.5px;
            }

            /* SANS-SERIF FOR CARD BODY TEXT */
            .card p {
                font-family:
                    system-ui,
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                font-size: 0.92rem;
                line-height: 1.65;
                opacity: 0.7;
                font-weight: 300;
            }
        </style>
    </head>
    <body>
        <!--<div class="frame-debugger">
            FRAME: <span id="debug-frame-val">0</span> / 299
        </div>-->

        <header>
            <div class="logo">NextGen</div>
            <nav><a href="#">The Design</a><a href="#">Pre-order</a></nav>
        </header>

        <div class="scroll-container">
            <div class="canvas-container">
                <canvas id="sequence-canvas"></canvas>
            </div>

            <div class="cards-overlay" id="cards-container"></div>

            <footer>
                <div>© 2026 NextGen Studio. All rights reserved.</div>
                <div>Scroll to Reveal</div>
            </footer>
        </div>

        <script>
            // Timings maintained precisely as requested
            const cardConfig = [
                {
                    id: 1,

                    title: "Welcome Video",

                    text: "The introductory video will be shown here.",

                    startFrame: 19,

                    endFrame: 30,

                    position: { top: "25%", left: "10%" },
                },

                {
                    id: 2,

                    title: "About Us/ Origin Story",

                    text: "This will include pictures and a brief history of the company.",

                    startFrame: 49,

                    endFrame: 62,

                    position: { top: "25%", right: "10%" },
                },

                {
                    id: 3,

                    title: "Menu",

                    text: "The menu with pictures of the dishes will be shown here.",

                    startFrame: 70,

                    endFrame: 85,

                    position: { bottom: "25%", left: "12%" },
                },

                {
                    id: 4,

                    title: "Upcoming Events",

                    text: "Current events that are happening are shown here with images.",

                    startFrame: 100,

                    endFrame: 114,

                    position: { bottom: "25%", right: "12%" },
                },

                {
                    id: 5,

                    title: "Instagram Photos/ Gallery",

                    text: "Photos from our Instagram feed will be shown here in a grid format.",

                    startFrame: 134,

                    endFrame: 142,

                    position: {
                        top: "40%",

                        left: "50%",

                        transform: "translateX(-50%)",
                    },
                },

                {
                    id: 6,

                    title: "Testimonials",

                    text: "Testimonials from our customers are shown here from Google reviews.",

                    startFrame: 160,

                    endFrame: 190,

                    position: {
                        bottom: "20%",

                        left: "50%",

                        transform: "translateX(-50%)",
                    },
                },

                {
                    id: 7,

                    title: "Contact Us",

                    text: "Email, contact number, feedback form.",

                    startFrame: 215,

                    endFrame: 230,

                    position: {
                        bottom: "20%",

                        left: "50%",

                        transform: "translateX(-50%)",
                    },
                },

                {
                    id: 8,

                    title: "Thank you For Visiting",

                    text: "Visit us soon at our new resturant.",

                    startFrame: 250,

                    endFrame: 270,

                    position: {
                        bottom: "20%",

                        left: "50%",

                        transform: "translateX(-50%)",
                    },
                },
            ];

            gsap.registerPlugin(ScrollTrigger);
            const canvas = document.getElementById("sequence-canvas");
            const context = canvas.getContext("2d");
            // const debugValEl = document.getElementById("debug-frame-val");

            canvas.width = 1920;
            canvas.height = 1080;

            const frameCount = 300;
            const currentFrame = (index) =>
                `/bhog56/toWEBP/Image Seq${String(index + 1).padStart(4, "0")}.webp`;

            const images = [];
            const videoSequence = { frame: 0 };

            for (let i = 0; i < frameCount; i++) {
                const img = new Image();
                img.src = currentFrame(i);
                images.push(img);
            }

            function render() {
                context.clearRect(0, 0, canvas.width, canvas.height);
                const img = images[videoSequence.frame];
                if (!img) return;

                const hRatio = canvas.width / img.width;
                const vRatio = canvas.height / img.height;
                const ratio = Math.max(hRatio, vRatio);
                const centerShift_x = (canvas.width - img.width * ratio) / 2;
                const centerShift_y = (canvas.height - img.height * ratio) / 2;

                context.drawImage(
                    img,
                    0,
                    0,
                    img.width,
                    img.height,
                    centerShift_x,
                    centerShift_y,
                    img.width * ratio,
                    img.height * ratio,
                );

                // debugValEl.textContent = videoSequence.frame;
            }

            images[0].onload = render;

            // --- GENERATE DOM CARDS ---
            const container = document.getElementById("cards-container");
            cardConfig.forEach((config) => {
                const cardEl = document.createElement("div");
                cardEl.className = "card";
                cardEl.id = `card-${config.id}`;
                cardEl.innerHTML = `<h3>${config.title}</h3><p>${config.text}</p>`;
                Object.assign(cardEl.style, config.position);
                container.appendChild(cardEl);
            });

            // --- MASTER SCROLL TIMELINE ---
            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: ".scroll-container",
                    start: "top top",
                    end: "bottom bottom",
                    scrub: 1,
                },
            });

            tl.to(
                videoSequence,
                {
                    frame: frameCount - 1,
                    snap: "frame",
                    ease: "none",
                    onUpdate: render,
                    duration: frameCount,
                },
                0,
            );

            // --- AUTOMATED GSAP TIMELINE MAPPER ---
            cardConfig.forEach((config) => {
                const cardSelector = `#card-${config.id}`;
                const fadeDuration = 2;

                // Fade In Action
                tl.to(
                    cardSelector,
                    {
                        opacity: 1,
                        scale: 1,
                        y: 0,
                        duration: fadeDuration,
                        ease: "power2.out",
                    },
                    config.startFrame,
                );

                // Fade Out Action
                tl.to(
                    cardSelector,
                    {
                        opacity: 0,
                        y: -15,
                        scale: 0.99,
                        duration: fadeDuration,
                        ease: "power2.in",
                    },
                    config.endFrame - fadeDuration,
                );
            });
        </script>
    </body>
</html>
